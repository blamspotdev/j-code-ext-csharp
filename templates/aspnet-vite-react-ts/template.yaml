id: aspnet-vite-react-ts
name: C# ASP.NET Core with Vite + React TypeScript
description: An ASP.NET Core API with a Vite + React (TypeScript) client.
requires:
  - dotnet
  - nodejs
inputs:
  - id: dotnetTfm
    label: .NET version
    type: select
    # Live from installed SDKs; falls back to the static list below when the runtime isn't ready.
    optionsCommand: "/usr/local/bin/dotnet --list-sdks 2>/dev/null | awk '{print $1}' | cut -d. -f1-2 | sort -Vru | sed 's/^/net/'"
    options: ["net10.0", "net9.0", "net8.0"]
    default: "net10.0"
recipe:
  - label: Create ASP.NET Core server
    run: dotnet new web -o "{{projectDir}}/Server"
  - label: Set target framework
    run: |
      for cs in "{{projectDir}}/Server"/*.csproj; do
        sed -i "s#<TargetFramework>[^<]*</TargetFramework>#<TargetFramework>{{dotnetTfm}}</TargetFramework>#" "$cs"
      done
  - label: Serve the built client from the server
    run: |
      cat > "{{projectDir}}/Server/Program.cs" <<'EOF'
      var builder = WebApplication.CreateBuilder(args);
      var app = builder.Build();

      // Serve the Vite-built React client published into wwwroot.
      app.UseDefaultFiles();
      app.UseStaticFiles();

      // Example API endpoint the client can call.
      app.MapGet("/api/hello", () => "Hello from ASP.NET Core");

      // SPA fallback: any non-file route returns index.html so client routing works.
      app.MapFallbackToFile("index.html");

      app.Run();
      EOF
  - label: Scaffold Vite React (TypeScript) client
    workdir: "{{hostStaging}}"
    run: CI=1 npm create vite@latest client -- --template react-ts </dev/null
  - label: Install client dependencies
    workdir: "{{hostStaging}}/client"
    run: npm install
  - label: Build client
    workdir: "{{hostStaging}}/client"
    run: npm run build
  - label: Publish client into server wwwroot
    run: mkdir -p "{{projectDir}}/Server/wwwroot" && cp -r "{{hostStaging}}/client/dist/." "{{projectDir}}/Server/wwwroot/"
  - label: Copy client source into project
    run: |
      set -eu
      cd "{{hostStaging}}/client"
      tar --exclude=node_modules --exclude=dist -cf - . | (mkdir -p "{{projectDir}}/client" && cd "{{projectDir}}/client" && tar -xf -)
      # A pipeline reports only its LAST command's status, so a producer that dies half-way still
      # looks like success and hands back a half-copied project. Steps run under dash, which has no
      # `pipefail`, so check the one file whose absence makes the result unusable: without a manifest
      # neither `npm install` nor `npm run dev` can run, and the generated run config cannot work.
      test -f "{{projectDir}}/client/package.json" || {
        echo "Copy incomplete: package.json did not reach {{projectDir}}/client." >&2
        exit 1
      }
  - label: Configure Build & Run
    run: |
      mkdir -p "{{projectDir}}/.jcode"
      cat > "{{projectDir}}/.jcode/run.yaml" <<'YAML'
      version: 1
      name: ASP.NET Core + Vite React (dev)
      readyPort: 5173
      terminals:
        - label: Run
          command: |
            clear
            set -e
            PROJ="{{projectDir}}"
            SRV="$HOME/.jcode-run/{{name}}-server"
            STAGE="$HOME/.jcode-run/{{name}}-client"
            export npm_config_fund=false npm_config_audit=false
            CSPROJ=$(ls "$PROJ/Server"/*.csproj | head -1)
            echo '== J Code: ASP.NET Core + Vite React (dev) =='
            echo '[1/3] Building server (dotnet build, Debug)...'
            rm -rf "$SRV"
            dotnet build "$CSPROJ" -c Debug -o "$SRV" --nologo
            echo '[2/3] Staging client + installing deps (npm install)...'
            rm -rf "$STAGE" && mkdir -p "$STAGE" && cp -a "$PROJ/client/." "$STAGE/"
            ( cd "$STAGE" && npm install )
            echo '[3/3] Starting server (:5080, background) + Vite client (:5173)...'
            ( cd "$SRV" && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS='http://0.0.0.0:5080' exec dotnet "$(basename "$CSPROJ" .csproj).dll" ) &
            SRV_PID=$!
            trap 'kill "$SRV_PID" 2>/dev/null' INT TERM EXIT
            cd "$STAGE"
            npm run dev -- --host 0.0.0.0 --port 5173
      YAML
